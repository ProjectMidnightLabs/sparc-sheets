<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PM-KR SPARC sheets</title>
<style>
  :root{
    --bg:#14081f; --card:#231433; --ink:#f6f1ff; --mute:#b9a8d4;
    --green:#39FF14; --pink:#FF2D95; --yellow:#FFF3B0; --line:#4a3568;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
  header{position:sticky;top:0;background:#1a0b2e;padding:12px 16px;border-bottom:1px solid var(--line);z-index:2}
  header h1{margin:0;font-size:18px;color:var(--green)}
  header p{margin:4px 0 0;font-size:12px;color:var(--mute)}
  nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px}
  nav button{background:#3d1a6e;color:#fff;border:0;border-radius:999px;padding:8px 12px;cursor:pointer}
  nav button.on{background:var(--pink)}
  main{padding:0 16px 40px;max-width:1100px;margin:0 auto}
  .note{background:var(--card);padding:12px;border-radius:12px;margin:8px 0;color:var(--mute);font-size:14px}
  table{width:100%;border-collapse:collapse;margin:10px 0 24px;font-size:13px}
  th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
  th{background:#1a0b2e}
  tr.hit td{background:#3a3210;color:var(--yellow)}
  input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#1a0b2e;color:#fff;margin:8px 0}
  a{color:var(--green)}
  section{display:none}
  section.on{display:block}
</style>
</head>
<body>
<header>
  <h1>PM-KR-2026-NSW SPARC sheets</h1>
  <p>Separate bench. Black squares on the old PDF were missing font glyphs (10^33), not redacted cells. Palette kept.</p>
</header>
<nav>
  <button class="on" data-t="key">Column key</button>
  <button data-t="light">Light bend</button>
  <button data-t="df2">DF2</button>
  <button data-t="df49">DF4 / DF9</button>
  <button data-t="am">Angular momentum</button>
  <button data-t="zpe">ZPE forms</button>
  <button data-t="press">Pressures</button>
  <button data-t="bh">Black holes</button>
  <button data-t="mast">Where full files live</button>
</nav>
<main>
<input id="q" placeholder="filter any table on this page"/>
<p>Open this file on the phone. Yellow rows are the DF2 sigma bin (~8 / 8.5). See README for Mac Mini path.</p>
</main>
<script>
const buttons=[...document.querySelectorAll('nav button')];
const secs=[...document.querySelectorAll('section')];
buttons.forEach(b=>b.onclick=()=>{buttons.forEach(x=>x.classList.remove('on'));secs.forEach(x=>x.classList.remove('on'));b.classList.add('on');const el=document.getElementById(b.dataset.t);if(el)el.classList.add('on');});
</script>
</body>
</html>
